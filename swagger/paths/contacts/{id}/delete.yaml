tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: 'Delete contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 6728d296023542183d93b08e
      description: 'The ID of the contact to delete'
responses:
  '204':
    description: 'No Content'
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: No Content
  '404':
    $ref: ../../../components/responses/404.yaml
